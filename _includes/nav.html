<header>
    <div class="container">
        <nav>
            <a href="/" class="logo-container" style="text-decoration: none;">
                <div class="seekive-logo">
                    <img src="/logo1.png" alt="Seekive Logo" style="width: 42px; height: 42px; object-fit: contain;">
                </div>
                <div class="logo-text">Seekive</div>
            </a>

            <!-- Mobile hamburger -->
            <button class="nav-toggle" aria-controls="mobileNav" aria-expanded="false" aria-label="Open menu">
                <span class="bar"></span><span class="bar"></span><span class="bar"></span>
            </button>

            <!-- Desktop links -->
            <ul class="nav-links">
                <li>
    <a href="/" {% if page.active_page == "home" %}style="color: var(--primary-blue);"{% endif %}>Home</a>
</li>
                <!-- <li><a href="/store/" {% if page.active_page == "store" %}style="color: var(--primary-blue);"{% endif %}>Store</a></li> -->
                <li><a href="/latest/" {% if page.active_page == "latest" %}style="color: var(--primary-blue);"{% endif %}>Latest</a></li>
                <!-- <li><a href="/community/" {% if page.active_page == "community" %}style="color: var(--primary-blue);"{% endif %}>Community</a></li> -->
                <li><a href="/timeline/" {% if page.active_page == "timeline" %}style="color: var(--primary-blue);"{% endif %}>Timeline</a></li>
                <li><a href="/contact/" {% if page.active_page == "contact" %}style="color: var(--primary-blue);"{% endif %}>Contact</a></li>
            </ul>

            <a href="/early-access-signup/" class="cta-nav desktop-only">Join Early Access</a>
        </nav>

        <!-- Off-canvas mobile menu -->
        <div id="mobileNav" class="mobile-nav" aria-hidden="true">
            <div class="mobile-nav__overlay" data-close></div>
            <div class="mobile-nav__panel">
                <button class="mobile-close" aria-label="Close menu">&times;</button>

                <a class="mobile-brand" href="/">
                    <img src="/logo1.png" alt="Seekive" width="28" height="28" style="vertical-align:middle;margin-right:8px;"> Seekive
                </a>

                <ul class="mobile-list">
                    <li><a href="/" class="{% if page.active_page == "home" %}is-active{% endif %}" data-close>Home</a></li>
                    <!-- <li><a href="/store/" class="{% if page.active_page == "store" %}is-active{% endif %}" data-close>Store</a></li>-->
                    <li><a href="/latest/" class="{% if page.active_page == "latest" %}is-active{% endif %}" data-close>Latest</a></li>
                    <!--<li><a href="/community/" class="{% if page.active_page == "community" %}is-active{% endif %}" data-close>Community</a></li>-->
                    <li><a href="/timeline/" class="{% if page.active_page == "timeline" %}is-active{% endif %}" data-close>Timeline</a></li>
                    <li><a href="/contact/" class="{% if page.active_page == "contact" %}is-active{% endif %}" data-close>Contact</a></li>
                </ul>

                <a href="/early-access-signup/" class="cta-nav mobile-cta" data-close>Join Early Access</a>
            </div>
        </div>
    </div>
</header>

<script>
/* ===== Mobile nav (open/close) ===== */
(function(){
    const navToggle = document.querySelector('.nav-toggle');
    const mobileNav = document.getElementById('mobileNav');
    const panel = mobileNav?.querySelector('.mobile-nav__panel');
    const overlay = mobileNav?.querySelector('.mobile-nav__overlay');
    const closeBtn = mobileNav?.querySelector('.mobile-close');

    function openMenu(){
        mobileNav.classList.add('open');
        document.body.classList.add('no-scroll');
        navToggle.classList.add('active');
        navToggle.setAttribute('aria-expanded','true');
        mobileNav.setAttribute('aria-hidden','false');
        const firstLink = mobileNav.querySelector('a,button');
        firstLink && firstLink.focus();
    }

    function closeMenu(){
        mobileNav.classList.remove('open');
        document.body.classList.remove('no-scroll');
        navToggle.classList.remove('active');
        navToggle.setAttribute('aria-expanded','false');
        mobileNav.setAttribute('aria-hidden','true');
        navToggle.focus();
    }

    if(navToggle && mobileNav){
        navToggle.addEventListener('click', ()=>{
            mobileNav.classList.contains('open') ? closeMenu() : openMenu();
        });
        overlay.addEventListener('click', closeMenu);
        closeBtn.addEventListener('click', closeMenu);
        window.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeMenu(); });
        mobileNav.querySelectorAll('[data-close]').forEach(el=> el.addEventListener('click', closeMenu));
        panel.addEventListener('wheel', (e)=> e.stopPropagation(), { passive:true });
        panel.addEventListener('touchmove', (e)=> e.stopPropagation(), { passive:true });
    }

    /* Collapsible Home sublist */
    const coll = document.getElementById('homeCollapsible');
    if(coll){
        const btn = coll.querySelector('.sub-toggle');
        const sub = coll.querySelector('.sublist');

        function expand(){
            coll.classList.add('open');
            btn.setAttribute('aria-expanded','true');
            sub.hidden = false;
            sub.style.height = 'auto';
            const h = sub.scrollHeight + 'px';
            sub.style.height = '0px';
            sub.getBoundingClientRect();
            sub.style.height = h;
            sub.addEventListener('transitionend', function done(e){
                if(e.propertyName === 'height'){
                    sub.style.height = 'auto';
                    sub.removeEventListener('transitionend', done);
                }
            });
        }

        function collapse(){
            coll.classList.remove('open');
            btn.setAttribute('aria-expanded','false');
            sub.style.height = sub.scrollHeight + 'px';
            sub.getBoundingClientRect();
            sub.style.height = '0px';
            sub.addEventListener('transitionend', function done(e){
                if(e.propertyName === 'height'){
                    sub.hidden = true;
                    sub.removeEventListener('transitionend', done);
                }
            });
        }

        btn.addEventListener('click', (e)=>{
            e.preventDefault();
            e.stopPropagation();
            btn.getAttribute('aria-expanded') === 'true' ? collapse() : expand();
        });
    }

    /* Scroll shadow on header */
    window.addEventListener('scroll', function(){
        const header = document.querySelector('header');
        if(header) header.style.boxShadow = window.scrollY > 100 ? '0 8px 32px rgba(0,0,0,0.3)' : 'none';
    });
})();
</script>
